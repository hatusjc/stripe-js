name: FinanFlow CI

on:
  workflow_dispatch:   # allows manual trigger from GitHub Actions tab
  push:
    branches: [ "claude/finanflow-finance-app-9S1cy", "main" ]
    paths:
      - 'finanflow/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'finanflow/**'

defaults:
  run:
    working-directory: finanflow

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test --no-pub --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: finanflow/coverage/lcov.info
          flags: flutter
        continue-on-error: true

  build-android-debug:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-pub

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanflow-debug-apk
          path: finanflow/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-android-release:
    name: Build Android App Bundle (release)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/finanflow.keystore

      - name: Write key.properties
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=finanflow.keystore
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: finanflow-release-aab
          path: finanflow/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
